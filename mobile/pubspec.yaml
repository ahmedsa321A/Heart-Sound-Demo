name: heart_ai
description: "HeartAI - AI-Powered Cardiac Health Monitoring"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.1.2
  cookie_jar: ^4.0.8

  # Storage
  flutter_secure_storage: ^9.2.4

  # Internationalization
  easy_localization: ^3.0.7
  intl: ^0.20.2

  # Audio
  record: ^5.2.1
  just_audio: ^0.9.43
  path_provider: ^2.1.5

  # Permissions
  permission_handler: ^11.4.0

  # UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/

dependency_overrides:
  record_platform_interface: 1.2.0

