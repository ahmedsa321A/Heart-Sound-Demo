# Render Blueprint — backend API (Node/Express + in-process heart sound model).
# Secrets marked `sync: false` are entered in the Render dashboard; JWT secrets are generated by Render.
services:
  - type: web
    name: heartai-api
    runtime: node
    plan: free
    region: frankfurt      # same region as the MongoDB Atlas cluster (AWS eu-central-1)
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "2"            # Vercel's /api proxy + Render's load balancer
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DB_URL
        sync: false           # MongoDB Atlas connection string
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false           # sender address verified in Brevo
      - key: ALLOWED_ORIGINS
        sync: false           # the Vercel site URL, e.g. https://heartai.vercel.app
